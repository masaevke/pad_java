openapi: 3.0.3
info:
  title: Petrovich AI - подписка на Telegram отчеты
  description: |
    Это API управления подписчиками Telegram-отчётов об автопарке.
    Основан на проекте Петрович, который я и моя команда реализовываем на 
    проектном практикуме
servers:
  - url: http://localhost:8080/api/v1
    description: Локальный адрес
tags:
  - name: Subscribers
    description: Получатели ежедневных отчётов Петровича
paths:
  /subscribers:
    get:
      tags: [Subscribers]
      operationId: listSubscribers
      summary: Получить список подписчиков
      description: Возвращает всех подписчиков по возрастанию id, включая неактивных
      responses:
        '200':
          description: Список подписчиков, при отсутствии подписчиков - пустой массив
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriberResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Subscribers]
      operationId: createSubscriber
      summary: Создать или возобновить подписку на отчёты
      description: |
        Если chat_id уже существует, обновляет время, заменяет имя при передаче
        непустого name и включает подписку. Иначе создаёт активную подписку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriberRequest'
      responses:
        '200':
          description: Подписка создана или возобновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Указанный chat_id отсутствует в списке разрешённых чатов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: chat_id not in ALLOWED_CHAT_IDS allowlist
  /subscribers/{subscriber_id}:
    parameters:
      - $ref: '#/components/parameters/SubscriberId'
    get:
      tags: [Subscribers]
      operationId: getSubscriber
      summary: Получить одного подписчика
      responses:
        '200':
          description: Подписчик найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Subscribers]
      operationId: updateSubscriber
      summary: Изменить настройки подписки
      description: |
        Изменяет только переданные ненулевые поля
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriberRequest'
      responses:
        '200':
          description: Подписчик с актуальными настройками.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Subscribers]
      operationId: deleteSubscriber
      summary: Удалить подписку на отчёты
      description: Удаляет подписчика. Повторное удаление возвращает 404.
      responses:
        '200':
          description: Подписка удалена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSubscriberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    SubscriberId:
      name: subscriber_id
      in: path
      required: true
      description: Идентификатор подписчика в сервисе
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1
  schemas:
    CreateSubscriberRequest:
      type: object
      additionalProperties: false
      required: [chat_id]
      properties:
        chat_id:
          type: integer
          format: int64
          description: Telegram chat_id, для групп обычно отрицательное значение
          example: -1001234567890
        name:
          type: string
          nullable: true
          maxLength: 128
          example: Диспетчер автопарка
        schedule_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          default: '09:30'
          example: '09:30'
          description: Время ежедневной рассылки, HH:MM, 24-часовой формат
    UpdateSubscriberRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          nullable: true
          maxLength: 128
          example: Старший диспетчер
        schedule_time:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '08:00'
        active:
          type: boolean
          nullable: true
          example: false
    SubscriberResponse:
      type: object
      required: [id, chat_id, name, username, schedule_time, active]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        chat_id:
          type: integer
          format: int64
          example: -1001234567890
        name:
          type: string
          nullable: true
          maxLength: 128
          example: Диспетчер автопарка
        username:
          type: string
          nullable: true
          maxLength: 64
          description: Telegram username, если он известен сервису
          example: dispatcher
        schedule_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '09:30'
        active:
          type: boolean
          example: true
    DeleteSubscriberResponse:
      type: object
      required: [id, deleted]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        deleted:
          type: boolean
          enum: [true]
          example: true
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: Причина ошибки, пригодная для отображения пользователю.
          example: subscriber not found
  responses:
    BadRequest:
      description: Некорректный JSON, тип поля, идентификатор или время (ожидается HH:MM).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: schedule_time must be HH:MM (24h)
    NotFound:
      description: Подписчик с указанным subscriber_id не существует.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: subscriber not found
    InternalError:
      description: Внутренняя ошибка сервиса при получении списка подписчиков.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: Unable to load subscribers
